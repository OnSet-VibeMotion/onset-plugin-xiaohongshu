<!doctype html><html lang="zh"><body>
<button class="creator-tab">上传视频</button>
<div class="header-draft"><div class="draft-title-box"><span class="draft-title">草稿箱</span></div></div>
<div class="d-drawer d-drawer-right draft-drawer" hidden><div class="d-drawer-content"><div class="draft-list"></div></div></div>
<input type="file" class="upload-input" accept="video/*">
<p id="progress">请上传视频</p>
<input placeholder="填写标题"><div contenteditable="true" class="tiptap ProseMirror" style="min-height:60px"></div>
<button class="upload-cover">设置封面</button>
<div class="d-modal" hidden><button>上传封面</button><div class="upload-wrapper"><input type="file" accept="image/*"></div><div class="d-modal-footer"><button id="confirm">确定</button></div></div>
<div class="publish-page-publish-btn"><button id="publish">发布</button></div>
<script>
window.submits=0; window.uploads=[];
document.querySelector('.upload-input').onchange=e=>{uploads.push(e.target.files[0].name);document.querySelector('#progress').textContent='上传成功，重新上传';};
document.querySelector('.upload-cover').onclick=()=>document.querySelector('.d-modal').hidden=false;
document.querySelector('#confirm').onclick=()=>{document.querySelector('.d-modal').hidden=true;document.querySelector('.upload-cover').textContent='编辑封面';};
document.querySelector('#publish').onclick=()=>submits++;

// 仿小红书的话题候选：正文末尾是「#xx」时弹出同前缀的话题（每项有 .name 与浏览量），只认真实的鼠标点击，
// 点中后把「#xx」换成 a[data-topic]。
window.knownTopics=['科技','科技感','AI'];
const editor=document.querySelector('[contenteditable]');
const box=document.createElement('div');box.id='creator-editor-topic-container';box.hidden=true;document.body.append(box);
function lastText(){const sel=getSelection();const at=sel.rangeCount?sel.getRangeAt(0).startContainer:null;if(at&&at.nodeType===3&&editor.contains(at))return at;const w=document.createTreeWalker(editor,NodeFilter.SHOW_TEXT);let n=null,t;while((t=w.nextNode()))n=t;return n;}
// window.hotTopic：候选输完字 120ms 后重画一次，把这个热门话题插到最前面（同名项被挤到下一行）。
// window.misfire：头几次点同名项时插进来的是它（仿点下去的瞬间列表换了）。
function renderTopics(hits){
  box.innerHTML=hits.map(t=>'<div class="item"><span class="name">#'+t+'</span><span class="num">10亿次浏览</span></div>').join('');
  box.hidden=!hits.length;
  box.querySelectorAll('.item').forEach((item,i)=>item.addEventListener('click',e=>{
    if(!e.isTrusted)return;
    const text=lastText(); const at=text.data.lastIndexOf('#'); text.data=text.data.slice(0,at);
    let name=hits[i]; if(window.misfire&&name!==window.hotTopic){window.misfire--;name=window.hotTopic||'别的话题';}
    const a=document.createElement('a'); a.setAttribute('data-topic',JSON.stringify({name})); a.textContent='#'+name+'[话题]#';
    const after=document.createTextNode('\u00a0'); text.after(a,after); box.hidden=true;
    editor.focus(); const r=document.createRange(); r.setStart(after,1); r.collapse(true); getSelection().removeAllRanges(); getSelection().addRange(r);
  }));
}
let rerender=0;
editor.addEventListener('input',()=>{
  const node=lastText(); const m=node&&/#([^\s#]+)$/.exec(node.data);
  const hits=m?knownTopics.filter(t=>t.toLowerCase().startsWith(m[1].toLowerCase())):[];
  renderTopics(hits); clearTimeout(rerender);
  if(hits.length&&window.hotTopic) rerender=setTimeout(()=>renderTopics([window.hotTopic,...hits]),120);
});
// 退格：光标前面是话题（中间最多隔一个空格）时整个删掉，像编辑器里不可编辑的话题节点。
// 退格：光标前面（中间最多隔一个空格）是话题时整个删掉，像编辑器里不可编辑的话题节点。
editor.addEventListener('keydown',e=>{
  if(e.key!=='Backspace')return;
  const sel=getSelection(); if(!sel.rangeCount)return; const r=sel.getRangeAt(0);
  let node=r.startContainer, before=null, space=null;
  if(node.nodeType===3){ if(/^[\s\u00a0]?$/.test(node.data.slice(0,r.startOffset))){space=node;before=node.previousSibling;} }
  else before=node.childNodes[r.startOffset-1];
  if(!before||before.nodeName!=='A')return;
  e.preventDefault(); const parent=before.parentNode; before.remove();
  const keep=space||parent.appendChild(document.createTextNode('\u00a0'));
  const nr=document.createRange(); nr.setStart(keep,space?Math.min(r.startOffset,keep.data.length):keep.data.length); nr.collapse(true); sel.removeAllRanges(); sel.addRange(nr);
});
// window.autoTopic：插进第一个话题后，页面自己在正文末尾追加一个不在清单里的话题（仿「关联活动」）。
new MutationObserver(()=>{ if(!window.autoTopic||editor.querySelector('a[data-auto]')||!editor.querySelector('a[data-topic]'))return;
  const a=document.createElement('a'); a.setAttribute('data-topic',JSON.stringify({name:window.autoTopic})); a.setAttribute('data-auto',''); a.textContent='#'+window.autoTopic+'[话题]#';
  const host=editor.lastElementChild&&editor.lastElementChild.nodeName==='DIV'?editor.lastElementChild:editor; host.append(a,document.createTextNode('\u00a0')); window.autoTopic='';
}).observe(editor,{childList:true,subtree:true});

// 仿小红书的草稿箱：草稿在本机 IndexedDB（draft-database-v1 / video-draft），抽屉里按标题与保存时间列出，
// 点「编辑」直接回到视频已上传、可以填写的状态。
document.querySelector('.draft-title').onclick=async()=>{
  const recs=await new Promise(r=>{const o=indexedDB.open('draft-database-v1');o.onsuccess=()=>{const db=o.result;if(![...db.objectStoreNames].includes('video-draft')){r([]);return;}const q=db.transaction('video-draft').objectStore('video-draft').getAll();q.onsuccess=()=>r(q.result);};});
  const pad=n=>String(n).padStart(2,'0'),fmt=ts=>{const t=new Date(ts);return t.getFullYear()+'-'+pad(t.getMonth()+1)+'-'+pad(t.getDate())+' '+pad(t.getHours())+':'+pad(t.getMinutes())+':'+pad(t.getSeconds());};
  const drawer=document.querySelector('.draft-drawer'),list=drawer.querySelector('.draft-list');
  list.innerHTML=recs.map(r=>'<div class="draft-item"><div class="draft-info"><div class="draft-info-desc"><div class="draft-title-text has-title">'+r.content.draftStore.title+'</div><div class="draft-time">保存于'+fmt(r.timeStamp)+'</div></div><div class="draft-actions"><div class="btn"><span>编辑</span></div><div class="btn"><span>删除</span></div></div></div></div>').join('');
  drawer.hidden=false;
  list.querySelectorAll('.draft-item').forEach((it,i)=>{const [edit,del]=it.querySelectorAll('.btn');
    edit.onclick=()=>{window.resumed=recs[i].draftId;drawer.hidden=true;document.querySelector('#progress').textContent='上传成功，重新上传';};
    del.onclick=()=>{window.deleted=true;};});
};
</script></body></html>
