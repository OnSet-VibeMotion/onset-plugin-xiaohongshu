<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小红书上传助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="/station-ui/_sdk.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">片场 · 小红书</span><h1>准备好，交给你发布。</h1><p>选择账号，上传成片和封面。文案填好后，在片场内的小红书页面检查并发布。</p></header>
    <section aria-label="选择小红书账号">
      <div class="label-row"><label for="accounts">发布到哪个账号</label><span class="links"><button id="refresh" class="quiet">刷新账号</button><button id="login" class="quiet">登录新账号</button></span></div>
      <div class="account-row"><img id="avatar" alt="" hidden><select id="accounts"><option value="">还没有账号，先登录一个</option></select><button id="open" disabled>打开小红书</button></div>
      <div class="actions"><button id="prepare" class="primary" disabled>上传并填写</button><span>自动填写后，由你检查并发布</span></div>
    </section>
    <p class="muted">登录与移除账号也可以在片场设置 → 功能与插件 → 小红书上传助手里做；各账号的登录状态独立保存，所有项目共用。</p>
    <div id="status" role="status" aria-live="polite">正在读取账号…</div>
    <ul id="warnings"></ul>
  </main>
</body>
</html>
