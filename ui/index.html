<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小红书上传助手</title>
  <link rel="stylesheet" href="style.css">
  <script src="/station-ui/_sdk.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <header><span class="eyebrow">片场 · 小红书</span><h1>准备好，交给你发布。</h1><p>选择账号，上传成片和封面。文案填好后，在小红书窗口检查并发布。</p></header>
    <section aria-label="选择小红书账号">
      <div class="label-row"><label for="accounts">发布到哪个账号</label><button id="refresh" class="quiet">刷新账号</button></div>
      <div class="account-row"><select id="accounts"><option value="">先添加账号，或刷新已有账号</option></select><button id="open" disabled>打开小红书</button></div>
      <div class="actions"><button id="prepare" class="primary" disabled>上传并填写</button><span>最后一步由你在小红书完成</span></div>
    </section>
    <details><summary>管理账号</summary><label for="name">账号备注名</label><div class="account-row"><input id="name" maxlength="40" placeholder="例如：个人号、工作号" autocomplete="off"><button id="add">添加并登录</button></div><button id="rename" class="quiet" disabled>将所选账号改为这个名称</button><p class="muted">各账号独立保存登录状态，所有片场项目共用。备注名仅用于区分，请在小红书窗口核对实际账号。</p></details>
    <div id="status" role="status" aria-live="polite">正在读取账号…</div>
    <ul id="warnings"></ul>
  </main>
</body>
</html>
